[package]
name = "triet_hoc_214"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "Event", "EventTarget", "Storage", "MouseEvent", "Performance", "Location"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
